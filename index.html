<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Timer</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="stopwatch-card">
        <h1>MY TIMER</h1>

        <div class="status">● Ready</div>

        <div class="timer-display">
          <span class="hour">00</span>:<span class="min">00</span>:<span
            class="sec"
            >00</span
          >
        </div>

        <div class="controls">
          <button class="btn start" onclick="startTimer()">Start</button>

          <button class="btn pause" onclick="pauseTimer()">Pause</button>

          <button class="btn reset" onclick="reset()">Reset</button>
        </div>

        <div class="lap-section">
          <h3>Laps</h3>

          <div class="lap-list">
            <div class="lap">
              Lap 1
              <span>00:14:22</span>
            </div>

            <div class="lap">
              Lap 2
              <span>00:26:48</span>
            </div>

            <div class="lap">
              Lap 3
              <span>00:41:05</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
